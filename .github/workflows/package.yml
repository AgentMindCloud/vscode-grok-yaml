name: Package

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build .vsix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JSON files
        run: |
          set -eu
          # Fails the job if any JSON under snippets/ or root manifest is invalid.
          for f in package.json snippets/*.json; do
            echo "→ validating $f"
            node --input-type=module -e "
              import { readFileSync } from 'node:fs';
              JSON.parse(readFileSync('$f', 'utf8'));
            "
          done

      - name: Verify yamlValidation schema count is 12
        run: |
          COUNT=$(node -e "console.log(require('./package.json').contributes.yamlValidation.length)")
          echo "yamlValidation entries: $COUNT"
          test "$COUNT" = "12"

      - name: Package extension
        run: npx --yes @vscode/vsce@latest package --no-dependencies

      - name: Upload .vsix artefact
        uses: actions/upload-artifact@v4
        with:
          name: grok-yaml-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 30
